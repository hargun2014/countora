<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countora | A Hargun Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Countora</h1>
    <p>A Hargun Project</p>
</header>

<div class="container">

    <div class="upload-area" id="uploadArea">
        <h2>Upload an Image</h2>
        <p>Choose an image or drag and drop it here</p>

        <input type="file" id="imageInput" accept="image/*" hidden>

        <button id="uploadButton" type="button">
            Choose Image
        </button>
    </div>

    <div class="workspace" id="workspace">

        <div class="toolbar">

            <div class="tool">
                <strong>Count:</strong>
                <span id="count">0</span>
            </div>

            <div class="tool">
                <label for="markerSize">Marker size</label>
                <input
                    type="range"
                    id="markerSize"
                    min="0.25"
                    max="70"
                    value="20"
                    step="0.25"
                >
                <span id="markerSizeValue">20px</span>
            </div>

            <div class="tool">
                <label for="numberSize">Number size</label>
                <input
                    type="range"
                    id="numberSize"
                    min="1"
                    max="40"
                    value="12"
                >
                <span id="numberSizeValue">12px</span>
            </div>

            <div class="tool">
                <strong>Number color</strong>

                <div class="color-options">

                    <button
                        class="color-option selected"
                        data-color="#4f46e5"
                        style="background:#4f46e5"
                        type="button">
                    </button>

                    <button
                        class="color-option"
                        data-color="#ef4444"
                        style="background:#ef4444"
                        type="button">
                    </button>

                    <button
                        class="color-option"
                        data-color="#22c55e"
                        style="background:#22c55e"
                        type="button">
                    </button>

                    <button
                        class="color-option"
                        data-color="#3b82f6"
                        style="background:#3b82f6"
                        type="button">
                    </button>

                    <button
                        class="color-option"
                        data-color="#f59e0b"
                        style="background:#f59e0b"
                        type="button">
                    </button>

                    <button
                        class="color-option"
                        data-color="#ec4899"
                        style="background:#ec4899"
                        type="button">
                    </button>

                    <button
                        class="color-option"
                        data-color="#ffffff"
                        style="background:#ffffff"
                        type="button">
                    </button>

                    <button
                        class="color-option"
                        data-color="#000000"
                        style="background:#000000"
                        type="button">
                    </button>

                </div>
            </div>

        </div>

        <div id="imageContainer">

            <img
                id="uploadedImage"
                alt="Uploaded image"
            >

            <div id="markers"></div>

        </div>

        <div class="actions">

            <button id="undoButton" type="button">
                Undo
            </button>

            <button id="clearButton" type="button">
                Clear
            </button>

        </div>

    </div>

</div>

<footer>
    Countora | A Hargun Project
</footer>

<script src="script.js"></script>

</body>
</html>
